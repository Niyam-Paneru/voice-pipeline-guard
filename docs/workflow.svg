<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Voice pipeline guard</title><desc id="d">Bounded audio enters validation, then latency and completeness gates determine whether output may display.</desc>
<rect width="1200" height="520" fill="#f5f5f1"/>
<text x="56" y="62" fill="#71716a" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">VOICE PIPELINE GUARD</text>
<text x="56" y="105" fill="#171714" font-family="Georgia,serif" font-size="34">Correct can still be too late.</text>

<rect x="58" y="175" width="185" height="95" rx="14" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="80" y="206" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">INPUT</text>
<text x="80" y="238" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">bounded audio</text>

<rect x="315" y="145" width="220" height="155" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="340" y="178" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">VALIDATION</text>
<text x="340" y="210" fill="#171714" font-family="Georgia,serif" font-size="24">Can we trust it?</text>
<text x="340" y="246" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">size</text>
<text x="405" y="246" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">format</text>
<text x="470" y="246" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">duration</text>

<rect x="615" y="145" width="220" height="155" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="640" y="178" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">TIMING</text>
<text x="640" y="210" fill="#171714" font-family="Georgia,serif" font-size="24">Can we use it now?</text>
<text x="640" y="246" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">all stages complete</text>
<text x="640" y="272" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">inside budget</text>

<rect x="915" y="175" width="225" height="95" rx="14" fill="#e4edb0" stroke="#596e35" stroke-width="2"/>
<text x="940" y="206" fill="#596e35" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">DISPLAY</text>
<text x="940" y="238" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">only if both pass</text>

<g stroke="#171714" stroke-width="2" fill="none"><path d="M243 222 H315"/><path d="M535 222 H615"/><path d="M835 222 H915"/></g>
<g fill="#171714"><path d="M307 216 l10 6 -10 6z"/><path d="M607 216 l10 6 -10 6z"/><path d="M907 216 l10 6 -10 6z"/></g>

<rect x="315" y="360" width="520" height="72" rx="14" fill="#262722"/>
<text x="340" y="389" fill="#d8d8d1" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">FAIL CLOSED</text>
<text x="340" y="417" fill="#fff" font-family="Georgia,serif" font-size="20">late or unknown timing suppresses output</text>
</svg>