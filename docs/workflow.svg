<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Voice pipeline guard workflow</title>
<desc id="d">Audio is bounded before validation, then processing stages pass a fail-closed latency gate before display.</desc>
<rect width="1200" height="320" fill="#0b1020"/>
<text x="56" y="52" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">Correct at 4.2 seconds can still be wrong.</text>
<path d="M90 172 H1110" stroke="#273449" stroke-width="5" stroke-linecap="round"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
  <g transform="translate(115)"><circle cy="172" r="27" fill="#60a5fa"/><text y="179" font-size="18" font-weight="700">1</text><text y="222" fill="#dbeafe" font-size="14">bounded read</text></g>
  <g transform="translate(315)"><circle cy="172" r="27" fill="#38bdf8"/><text y="179" font-size="18" font-weight="700">2</text><text y="222" fill="#dbeafe" font-size="14">validate WAV</text></g>
  <g transform="translate(515)"><circle cy="172" r="27" fill="#22d3ee"/><text y="179" font-size="18" font-weight="700">3</text><text y="222" fill="#cffafe" font-size="14">process stage</text></g>
  <g transform="translate(715)"><circle cy="172" r="27" fill="#f59e0b"/><text y="179" font-size="18" font-weight="700">4</text><text y="222" fill="#fef3c7" font-size="14">latency gate</text></g>
  <g transform="translate(915)"><circle cy="172" r="27" fill="#a78bfa"/><text y="179" font-size="18" font-weight="700">5</text><text y="222" fill="#ede9fe" font-size="14">metadata log</text></g>
  <g transform="translate(1090)"><circle cy="172" r="27" fill="#4ade80"/><text y="179" font-size="18" font-weight="700">✓</text><text y="222" fill="#dcfce7" font-size="14">display?</text></g>
</g>
<text x="715" y="118" fill="#fb7185" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">late / unknown → suppress</text>
<text x="1140" y="286" fill="#64748b" font-family="Arial,sans-serif" font-size="13" text-anchor="end">The caller has already hung up. Please do not celebrate the transcript.</text>
</svg>