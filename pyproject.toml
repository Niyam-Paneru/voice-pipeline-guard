[project]
name = "voice-pipeline-guard"
version = "1.0.0"
description = "Bounded audio capture validation and a fail-closed latency gate for realtime voice pipelines."
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["realtime", "audio", "latency", "fail-closed", "voice-ai"]

[project.scripts]
demo = "audio_guard.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
